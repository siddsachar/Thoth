# Temporary OSV exceptions for packages that do not yet have a compatible fix.
#
# Keep these package/version-specific overrides narrow and time-bound. Fixed
# dependencies should be upgraded instead of added to this file.

[[PackageOverrides]]
name = "setuptools"
version = "81.0.0"
ecosystem = "PyPI"
vulnerability.ignore = true
effectiveUntil = 2026-09-30
reason = "Torch 2.11 requires setuptools<82; the fixed 83.x line cannot resolve until a matching supported Torch/Torchaudio CPU release is available."

[[PackageOverrides]]
name = "torch"
version = "2.11.0"
ecosystem = "PyPI"
vulnerability.ignore = true
effectiveUntil = 2026-09-30
reason = "Torch 2.13 is fixed, but Torchaudio has no matching 2.13 release for the supported CPU platforms; 2.11 remains the newest matching pair."

[[PackageOverrides]]
name = "torch"
version = "2.11.0+cpu"
ecosystem = "PyPI"
vulnerability.ignore = true
effectiveUntil = 2026-09-30
reason = "Torch 2.13 is fixed, but Torchaudio has no matching 2.13 release for the supported CPU platforms; 2.11 remains the newest matching pair."

[[PackageOverrides]]
name = "image-size"
version = "2.0.2"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-09-30
reason = "Docusaurus currently resolves image-size 2.0.2 and OSV lists no fixed release; usage is limited to the documentation build pipeline."
